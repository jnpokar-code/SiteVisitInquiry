name: Build Site Visit Inquiry APK

'on': workflow_dispatch: push: branches: - main

jobs: build: runs-on: ubuntu-latest

steps: - name: Checkout Project uses: actions/checkout@v4

- name: Setup Java uses: actions/setup-java@v4 with: distribution: temurin java-version: '17'

- name: Setup Android SDK uses: android-actions/setup-android@v3 with: packages: ''

- name: Install Android SDK Packages run: | sdkmanager --licenses sdkmanager "platform-tools" sdkmanager "platforms;android-35" sdkmanager "build-tools;35.0.0"

- name: Build APK run: | if [ -f ./gradlew ]; then chmod +x ./gradlew ./gradlew assembleDebug else echo "ERROR: gradlew file not found" exit 1 fi

- name: Upload APK if: success() uses: actions/upload-artifact@v4 with: name: SiteVisitInquiry-APK path: app/build/outputs/apk/debug/app-debug.apk
